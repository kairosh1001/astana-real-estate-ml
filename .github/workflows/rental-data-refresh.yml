name: Rental dataset refresh

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rental-data-refresh
    paths:
      - .github/workflows/rental-data-refresh.yml

permissions:
  contents: write

concurrency:
  group: rental-data-refresh
  cancel-in-progress: false

jobs:
  collect-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect monthly listings
        continue-on-error: true
        run: >-
          python scripts/scrape_rentals.py
          --period monthly
          --start-page 1
          --pages 25
          --max-listings 500
          --min-delay 0.8
          --max-delay 1.4
          --append

      - name: Collect daily listings
        continue-on-error: true
        run: >-
          python scripts/scrape_rentals.py
          --period daily
          --start-page 1
          --pages 25
          --max-listings 500
          --min-delay 0.8
          --max-delay 1.4
          --append

      - name: Record collection status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          status = {}
          for period in ("monthly", "daily"):
              path = Path("data") / f"rent_{period}_raw.csv"
              frame = pd.read_csv(path)
              status[period] = {
                  "snapshots": len(frame),
                  "unique_listings": int(frame["listing_id"].astype(str).nunique()),
                  "latest_scrape": str(frame["scraped_at"].max()),
              }
          Path("data/rental_collection_status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(status, indent=2))
          PY

      - name: Train monthly model when enough data was collected
        run: |
          rows=$(python -c "import pandas as pd; print(pd.read_csv('data/rent_monthly_raw.csv').listing_id.astype(str).nunique())")
          if [ "$rows" -ge 100 ]; then
            python scripts/retrain_rental_models.py --period monthly --min-rows 100 --iterations 800
          fi

      - name: Train daily model when enough data was collected
        run: |
          rows=$(python -c "import pandas as pd; print(pd.read_csv('data/rent_daily_raw.csv').listing_id.astype(str).nunique())")
          if [ "$rows" -ge 100 ]; then
            python scripts/retrain_rental_models.py --period daily --min-rows 100 --iterations 800
          fi

      - name: Commit dataset and candidate model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rent_monthly_raw.csv data/rent_daily_raw.csv data/rental_collection_status.json
          git add models/rent_monthly models/rent_daily
          git commit -m "Refresh rental datasets and candidate models"
          git push
