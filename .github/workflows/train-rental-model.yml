name: Train monthly rental model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/train-rental-model.yml

permissions:
  contents: write

concurrency:
  group: train-monthly-rental-model
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        rooms: ["1", "2", "3"]
        start_page: [1, 8, 15, 22, 29, 36, 43, 50, 57, 64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scraper dependencies
        run: python -m pip install pandas requests beautifulsoup4

      - name: Scrape one isolated Almaty shard
        run: >-
          python -u scripts/scrape_rentals.py
          --cities almaty
          --rooms "${{ matrix.rooms }}"
          --start-page "${{ matrix.start_page }}"
          --pages 3
          --max-listings 100
          --min-delay 0.02
          --max-delay 0.06
          --output "data/rent-${{ matrix.rooms }}-${{ matrix.start_page }}.csv"
          --status-output "data/status-${{ matrix.rooms }}-${{ matrix.start_page }}.json"

      - name: Upload rental shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-shard-${{ matrix.rooms }}-${{ matrix.start_page }}
          path: |
            data/rent-${{ matrix.rooms }}-${{ matrix.start_page }}.csv
            data/status-${{ matrix.rooms }}-${{ matrix.start_page }}.json
          if-no-files-found: warn
          retention-days: 7

  train:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download all Almaty shards
        uses: actions/download-artifact@v4
        with:
          pattern: rental-shard-*
          path: data/shards
          merge-multiple: true

      - name: Merge Astana history and Almaty shards
        run: |
          mkdir -p data
          git fetch origin codex/rental-data-refresh:refs/remotes/origin/codex/rental-data-refresh
          git show origin/codex/rental-data-refresh:data/rent_monthly_raw.csv > data/rent_astana.csv
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          paths = [Path("data/rent_astana.csv"), *Path("data/shards").glob("rent-*.csv")]
          frames = [pd.read_csv(path, low_memory=False) for path in paths if path.exists()]
          combined = pd.concat(frames, ignore_index=True, sort=False)
          combined = combined.drop_duplicates("url", keep="last")
          combined.to_csv("data/rent_monthly_raw.csv", index=False)
          print(combined.get("scrape_city", pd.Series(dtype="string")).value_counts(dropna=False))
          print(f"merged rows={len(combined)} files={len(frames)}")
          PY

      - name: Train and evaluate independent rental quantile models
        run: python -u scripts/train_rental_model.py --iterations 900

      - name: Require production-quality coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evaluation = json.loads(Path("models/rent_monthly_v2/evaluation.json").read_text())
          if not evaluation.get("production_ready"):
              raise SystemExit(
                  "Rental bundle did not pass production gates:\n"
                  + json.dumps(evaluation, indent=2, ensure_ascii=False)
              )
          print(json.dumps(evaluation, indent=2, ensure_ascii=False))
          PY

      - name: Commit the validated model bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/rent_monthly_v2
          git commit -m "Train production monthly rental model"
          git push

      - name: Upload evaluation and model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-rental-model-run
          path: models/rent_monthly_v2
          if-no-files-found: warn
          retention-days: 14
