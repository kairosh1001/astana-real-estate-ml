name: Train monthly rental model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/train-rental-model.yml

permissions:
  contents: write

concurrency:
  group: train-monthly-rental-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Seed the current dataset from the validated Astana snapshot
        run: |
          mkdir -p data
          git fetch origin codex/rental-data-refresh:refs/remotes/origin/codex/rental-data-refresh
          git show origin/codex/rental-data-refresh:data/rent_monthly_raw.csv > data/rent_monthly_raw.csv

      - name: Scrape current Almaty monthly rentals
        run: >-
          python -u scripts/scrape_rentals.py
          --cities almaty
          --pages 100
          --max-listings 2500
          --min-delay 0.12
          --max-delay 0.28
          --append

      - name: Train and evaluate independent rental quantile models
        run: python -u scripts/train_rental_model.py --iterations 900

      - name: Require production-quality coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evaluation = json.loads(
              Path("models/rent_monthly_v2/evaluation.json").read_text()
          )
          if not evaluation.get("production_ready"):
              raise SystemExit(
                  "Rental bundle did not pass production gates:\n"
                  + json.dumps(evaluation, indent=2, ensure_ascii=False)
              )
          print(json.dumps(evaluation, indent=2, ensure_ascii=False))
          PY

      - name: Commit the validated model bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/rent_monthly_v2
          git commit -m "Train production monthly rental model"
          git push

      - name: Upload evaluation and model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-rental-model-run
          path: |
            models/rent_monthly_v2
            data/rent_monthly_scrape_status.json
          if-no-files-found: warn
          retention-days: 14
